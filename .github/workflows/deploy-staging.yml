name: Deploy — Staging

# Merges to `develop` auto-deploy to staging. Vercel deploys web/admin on git
# push natively (once the repo is connected in the Vercel dashboard) — this
# workflow only handles the API (Railway), which needs an explicit trigger.
on:
  push:
    branches: [develop]

jobs:
  deploy-api-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Always build the image, token or not. This is the job's real safety
      # net: a broken Dockerfile fails here rather than at the next deploy.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pratikar-api:${{ github.sha }} .

      # The image must be able to load a Prisma query engine and run
      # LibreOffice. Both have silently broken before — cheap to assert here,
      # expensive to discover in staging.
      - name: Verify runtime dependencies
        run: |
          docker run --rm pratikar-api:${{ github.sha }} \
            node -e "const {PrismaClient}=require('@prisma/client'); new PrismaClient(); console.log('prisma client ok')"
          docker run --rm pratikar-api:${{ github.sha }} soffice --headless --version

      - name: Check for Railway credentials
        id: creds
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy API to Railway (staging)
        if: steps.creds.outputs.present == 'true'
        run: |
          npm install -g @railway/cli
          railway up --service api --environment staging --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Don't let a green check imply a deploy that never happened.
      - name: Report skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "::warning title=Deploy skipped::RAILWAY_TOKEN is not set — the image was built and verified, but nothing was deployed. Add the secret once the Railway project exists."
