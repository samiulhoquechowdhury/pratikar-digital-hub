version: "3.8"

services:
  postgres:
    # pgvector build of the same Postgres 16 — the knowledge base stores its
    # embeddings in a vector column (docs/trd.md 2.5). Same data directory
    # format, and trixie matches the glibc (collation) of the official image
    # the volume was created under, so the existing data carries over.
    image: pgvector/pgvector:pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pratikar
    ports:
      - "5433:5432"
    volumes:
      - pratikar_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pratikar_postgres_data:
